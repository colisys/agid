<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地牢探险 · 网关对局</title>
    <style>
      :root {
        --fg: #8ee88a;
        --dim: #5c7a5c;
        --bg: #0a0f0a;
        --line: #1e2b1e;
        --amber: #e8b46a;
        --bad: #d97a6c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 14px;
        line-height: 1.5;
        max-width: 420px;
        margin: 1.2em auto;
        padding: 0 0.8em 2em;
      }
      h2 {
        font-size: 1.05em;
        margin: 0.2em 0 0.6em;
        letter-spacing: 0.08em;
      }
      .cfg {
        border: 1px solid var(--line);
        padding: 0.5em;
        margin-bottom: 0.8em;
      }
      .cfg label {
        display: block;
        color: var(--dim);
        font-size: 0.8em;
        margin: 0.25em 0;
      }
      input {
        background: #060906;
        color: var(--fg);
        border: 1px solid var(--line);
        font: inherit;
        width: 12em;
        padding: 0.1em 0.3em;
      }
      input.wide {
        width: 100%;
      }
      button {
        font: inherit;
        background: #060906;
        color: var(--fg);
        border: 1px solid var(--line);
        padding: 0.25em 0.6em;
        cursor: pointer;
        margin: 0.15em 0.2em 0.15em 0;
      }
      button:hover {
        border-color: var(--fg);
      }
      button:disabled {
        color: #33402f;
        border-color: #16201699;
        cursor: default;
      }
      button.on {
        background: #16301a;
        border-color: var(--fg);
      }
      #top {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed var(--line);
        padding-bottom: 0.3em;
      }
      #foe {
        border: 1px solid var(--line);
        padding: 0.4em 0.5em;
        margin: 0.5em 0;
        min-height: 3.4em;
      }
      #foe .name {
        font-weight: bold;
      }
      #foe .quiet {
        color: var(--dim);
      }
      #foe .tag {
        color: var(--amber);
        font-size: 0.82em;
        border: 1px solid #4a3a20;
        padding: 0 0.3em;
        margin-left: 0.4em;
      }
      .hp {
        color: var(--dim);
      }
      .bar {
        display: inline-block;
        width: 90px;
        height: 0.7em;
        border: 1px solid var(--line);
        vertical-align: middle;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--fg);
      }
      .chips {
        min-height: 1.2em;
        margin: 0.2em 0;
      }
      .chip {
        display: inline-block;
        font-size: 0.76em;
        border: 1px solid #3a2a2a;
        color: var(--bad);
        padding: 0 0.35em;
        margin: 0 0.3em 0.2em 0;
      }
      .chip.good {
        border-color: #2a3a2a;
        color: var(--fg);
      }
      #event {
        border: 1px solid #4a3a20;
        padding: 0.5em;
        margin: 0.5em 0;
      }
      #event .ttl {
        color: var(--amber);
        font-weight: bold;
      }
      #event .desc {
        color: var(--dim);
        font-size: 0.84em;
        margin: 0.15em 0 0.3em;
      }
      #event .dl {
        color: var(--dim);
        font-size: 0.78em;
      }
      #event .bar {
        display: inline-block;
        width: 5em;
        height: 0.45em;
        background: #332a18;
        border-radius: 0.25em;
        vertical-align: middle;
        margin: 0 0.35em;
        overflow: hidden;
      }
      #event .bar > i {
        display: block;
        height: 100%;
        background: var(--amber);
      }
      #event button {
        border-color: #4a3a20;
        color: var(--amber);
      }
      #event button:hover {
        border-color: var(--amber);
      }
      #event button .cost {
        color: var(--dim);
      }
      #bag {
        border-top: 1px dashed var(--line);
        padding-top: 0.3em;
        font-size: 0.88em;
      }
      #bag .slotline {
        color: var(--dim);
      }
      #bag .slotline b {
        color: var(--fg);
        font-weight: normal;
      }
      #bag .it {
        display: inline-block;
        border: 1px solid var(--line);
        padding: 0.05em 0.4em;
        margin: 0.15em 0.3em 0.15em 0;
      }
      #bag .it .cur {
        color: var(--amber);
      }
      #bag .it .lore {
        color: #8f7fa8;
        font-style: italic;
      }
      #bag .it button {
        font-size: 0.86em;
        padding: 0 0.35em;
        margin: 0 0 0 0.35em;
      }
      #acts {
        margin: 0.5em 0;
      }
      #log {
        border-top: 1px dashed var(--line);
        padding-top: 0.4em;
        max-height: 40vh;
        overflow-y: auto;
        font-size: 0.86em;
      }
      #log div {
        color: var(--dim);
      }
      #log div.new {
        color: var(--fg);
      }
      #log .flavor {
        color: #d6f5a8;
        font-style: italic;
      }
      /* 看不见的手：军师低语 / 地牢之主动静 / 诅咒 */
      #log div.whisper {
        color: #b39ddb;
        font-style: italic;
      }
      #log div.dm {
        color: #c86a5a;
      }
      #log div.curse {
        color: var(--blood, #c14b3a);
      }
      #log .t {
        color: var(--dim);
        font-size: 0.85em;
      }
      #status {
        color: var(--dim);
        min-height: 1.4em;
      }
      #status.warn {
        color: #e8b46a;
      }
      /* 下潜排行榜（solver 服务 /svc/dungeon/solver/top） */
      .board {
        border: 1px solid #3a4a3a;
        padding: 0.4em 0.6em;
        margin: 0.4em 0;
        font-size: 0.82em;
        color: var(--dim);
      }
      .board .rk {
        color: var(--amber);
        margin-right: 0.3em;
      }
    </style>
  </head>
  <body>
    <h2>地 牢 探 险</h2>
    <div class="cfg">
      <label
        >网关地址（留空 = 本页面同源网关）<input
          id="base"
          class="wide"
          placeholder="同源"
      /></label>
      <label
        >Admin Token（/v1/games 与 /admin 同权限，本机 loopback 也必须填）<input
          id="token"
          class="wide"
          type="password"
          autocomplete="off"
          spellcheck="false"
      /></label>
      <label
        >种子 <input id="seed" type="number" placeholder="留空随机" />（留空 = 每局随机；同种子可复现）
      </label>
      <button id="new">进入地牢</button>
      <button id="stop">放弃</button>
      <label>冒险者大名 <input id="pname" size="10" value="无名者" autocomplete="off" /></label>
    </div>
    <div id="board" class="board"></div>
    <div id="top"><span id="head">未开局</span><span id="clock"></span></div>
    <div id="foe"><span class="quiet">火把还未点亮。</span></div>
    <div class="chips" id="chips"></div>
    <div id="event" hidden></div>
    <div id="acts"></div>
    <div id="bag"></div>
    <div id="status"></div>
    <div id="log"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const LABEL = {
        attack: "攻击",
        guard: "格挡",
        potion: "喝药",
        flee: "逃跑",
        descend: "下潜",
        explore: "探索",
      };
      const ST_LABEL = {
        poison: "中毒",
        burn: "灼烧",
        shield: "圣盾",
        might: "巨力",
      };
      const SLOT_LABEL = { weapon: "武器", armor: "护甲", trinket: "饰品" };
      // 行为驱动对局：1 tick = 玩家的一轮行动，世界只在收到指令时推进，
      // 界面以「轮」为单位展示（不再有自动流逝的时间概念）。
      let matchId = null,
        over = true,
        busy = false, // 指令在途标志：防连点重复结算
        es = null,
        cur = null,
        CATALOG = {};

      function headers() {
        const h = { "Content-Type": "application/json" };
        const t = $("token").value.trim();
        if (t) {
          // HTTP 头只允许 ISO-8859-1：混入中文等字符时 fetch 会直接抛晦涩错误，这里先拦下给提示
          if (/[^\x00-\xff]/.test(t))
            throw new Error(
              "Admin Token 含非 ASCII 字符（可能是误贴了中文或浏览器自动填充），请重新填写",
            );
          h["X-Admin-Token"] = t;
        }
        return h;
      }
      function base() {
        const v = $("base").value.trim();
        return v ? v.replace(/\/$/, "") : location.origin; // 同源：页面由网关 /play 托管时直接可用
      }
      async function api(method, path, body) {
        const r = await fetch(base() + path, {
          method,
          headers: headers(),
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!r.ok)
          throw new Error(
            method +
              " " +
              path +
              " -> " +
              r.status +
              " " +
              (await r.text()).slice(0, 120),
          );
        return r.json();
      }
      function cat(s) {
        return (s && s.catalog) || CATALOG;
      }
      // 装备条目是 "id@depth" 实例（属性按获取层定格）；catalog 按 base 查。
      function baseOf(e) {
        const i = String(e).indexOf("@");
        return i < 0 ? String(e) : String(e).slice(0, i);
      }
      function gearDepth(e) {
        const i = String(e).indexOf("@");
        return i < 0 ? 1 : parseInt(String(e).slice(i + 1), 10) || 1;
      }
      // 实例属性 = 基础值 + floor((深度-1)/3)，与 rules 公式一致。
      function gearStat(v, e) {
        return v ? v + Math.floor((gearDepth(e) - 1) / 3) : 0;
      }
      function isUnid(s, entry) {
        return (s.unidentified || []).indexOf(baseOf(entry)) >= 0;
      }
      // 条目显示名：未鉴定 → ???；其余按 base 查 catalog。
      function itemLabel(s, entry) {
        if (isUnid(s, entry)) return "？？？";
        const it = cat(s)[baseOf(entry)];
        return it ? it.name : String(entry);
      }
      function itemOf(s, id) {
        return cat(s)[baseOf(id)] || null;
      }
      function bar(cur, max) {
        const pct =
          max > 0
            ? Math.max(0, Math.min(100, Math.round((cur * 100) / max)))
            : 0;
        return (
          '<span class="bar"><i style="width:' +
          pct +
          '%"></i></span> ' +
          cur +
          "/" +
          max
        );
      }

      // 状态效果徽章：dmg>0 或诅咒类为红色，其余绿色；剩余轮数（每轮 -1）。
      function drawChips(s) {
        const el = $("chips");
        const parts = [];
        const st = s.statuses || {};
        Object.keys(st).forEach((k) => {
          const inst = st[k] || {};
          parts.push(
            '<span class="chip">' +
              (ST_LABEL[k] || k) +
              " " +
              (inst.turns != null ? inst.turns + "轮" : "") +
              (inst.dmg ? " -" + inst.dmg + "/轮" : "") +
              "</span>",
          );
        });
        el.innerHTML = parts.join("");
      }

      function drawFoe(s) {
        const el = $("foe");
        if (s.status === "dead") {
          el.innerHTML = '<span class="name">你阵亡了</span>';
          drawChips(s);
          return;
        }
        if (s.status === "won") {
          el.innerHTML = '<span class="name">地牢之主已被击败</span>';
          drawChips(s);
          return;
        }
        const f = s.foe;
        if (!f) {
          const quota = s.foes_left || 0;
          let quiet;
          if (quota > 0) {
            // 文案库 quota 场景（LLM 预生成）：按 tick 轮换，静态文案兜底
            const lines = (s.flavor_bank && s.flavor_bank.quota) || [];
            quiet =
              lines.length
                ? lines[(s.tick || 0) % lines.length]
                : "石阶被封着——黑暗里有东西守着它。没人知道它们蛰伏了多久，一动，便会惊醒。";
          } else {
            quiet = "这一层暂时安静。可下潜，或再探索——黑暗里东西不少。";
          }
          el.innerHTML = '<span class="quiet">' + quiet + "</span>";
          drawChips(s);
          return;
        }
        const mark = f.boss ? "★ " : f.elite ? "▲ " : "";
        const intent = f.intent
          ? '<span class="tag">意图·' + esc(f.intent) + "</span>"
          : "";
        const fst = [];
        Object.keys(f.statuses || {}).forEach((k) => {
          fst.push(
            '<span class="chip">' +
              (ST_LABEL[k] || k) +
              " " +
              ((f.statuses[k] || {}).turns || "") +
              "</span>",
          );
        });
        el.innerHTML =
          '<div class="name">' +
          mark +
          esc(f.name) +
          ' <span class="hp">攻击 ' +
          f.atk +
          "</span>" +
          intent +
          "</div>" +
          '<div class="hp">体力 ' +
          bar(f.hp, f.hp_max) +
          "</div>" +
          '<div class="chips">' +
          fst.join("") +
          "</div>";
        drawChips(s);
      }

      // 事件房面板：标题/描述/选项按钮/倒计时。选项合法性归规则（金币不足会被拒），
      // 倒计时归 rules（pending.left 归零自动执行 default），这里只做展示。
      function drawEvent(s) {
        const el = $("event");
        const p = s.pending;
        if (!p) {
          el.hidden = true;
          el.innerHTML = "";
          return;
        }
        el.hidden = false;
        const left = Math.max(0, p.left || 0);
        const total = 6; // event_deadline；仅展示用
        const pct = Math.max(
          0,
          Math.min(100, Math.round((left * 100) / total)),
        );
        const opts = (p.options || [])
          .map(
            (o) =>
              '<button data-opt="' +
              esc(o.id) +
              '"' +
              (over ? " disabled" : "") +
              ">" +
              esc(o.label) +
              (typeof o.cost === "number"
                ? ' <span class="cost">(' + o.cost + "金)</span>"
                : "") +
              "</button>",
          )
          .join("");
        el.innerHTML =
          '<div class="ttl">⚑ ' +
          esc(p.title || "未知遭遇") +
          "</div>" +
          (p.desc ? '<p class="desc">' + esc(p.desc) + "</p>" : "") +
          '<div class="dl">决定时间还剩 <span class="bar"><i style="width:' +
          pct +
          '%"></i></span> ' +
          left +
          " 轮（超时默认：" +
          esc(p.default || "-") +
          "）</div>" +
          "<div>" +
          opts +
          "</div>";
        el.querySelectorAll("button[data-opt]").forEach((b) => {
          b.onclick = () => orderChoose(b.getAttribute("data-opt"));
        });
      }

      // 指令按钮完全由服务端下发的 legal actions 生成：合法性归规则，前端不猜。
      // use:<id> 通过 catalog 查名字，前端不硬编码道具表。
      function drawActs(s) {
        const el = $("acts");
        el.innerHTML = "";
        (s.actions || []).forEach((a) => {
          const b = document.createElement("button");
          let label = LABEL[a] || a;
          if (a.indexOf("use:") === 0) {
            const it = itemOf(s, a.slice(4));
            label = "用·" + (it ? it.name : a.slice(4));
          }
          b.textContent = label;
          if (it_title(s, a)) b.title = it_title(s, a);
          if (s.hero && s.hero.stance === a) b.className = "on";
          b.disabled = over || s.status === "dead" || s.status === "won";
          b.onclick = () => order(a);
          el.appendChild(b);
        });
      }
      function it_title(s, a) {
        if (a.indexOf("use:") !== 0) return "";
        const it = itemOf(s, a.slice(4));
        return it && it.desc ? it.name + "：" + it.desc : "";
      }

      // 背包：已装备三栏 + 物品格（同类累积 ×N，未鉴定显示 ???）。
      // 装备/卸换是免费动作，点击即发 equip 指令（带完整条目）；
      // 消耗品的效果按钮在动作区（legal actions），这里展示说明。
      function drawBag(s) {
        const el = $("bag");
        if (!s.hero) {
          el.innerHTML = "";
          return;
        }
        const eq = s.equip || {};
        const slots = ["weapon", "armor", "trinket"]
          .map((slot) => {
            const entry = eq[slot];
            const known = entry && !isUnid(s, entry);
            const it = entry ? itemOf(s, entry) : null;
            const stat =
              entry && known && it
                ? [
                    gearStat(it.atk, entry) ? "攻+" + gearStat(it.atk, entry) : "",
                    gearStat(it.armor, entry) ? "甲+" + gearStat(it.armor, entry) : "",
                    gearStat(it.hp_max, entry) ? "血上限+" + gearStat(it.hp_max, entry) : "",
                  ]
                    .filter(Boolean)
                    .join("/")
                : "";
            return (
              SLOT_LABEL[slot] +
              " <b>" +
              (entry ? esc(itemLabel(s, entry)) : "—") +
              "</b>" +
              (stat ? ' <span class="hp">' + stat + "</span>" : "")
            );
          })
          .join(" · ");
        // 同条目（同类+同实例深度）分组累积
        const groups = [];
        (s.inventory || []).forEach((entry) => {
          const g = groups.find((x) => x.entry === entry);
          if (g) g.count += 1;
          else groups.push({ entry, count: 1 });
        });
        const inv = groups
          .map(({ entry, count }) => {
            const it = itemOf(s, entry);
            const unid = isUnid(s, entry);
            if (!it && !unid) return "";
            const equipped = it && it.slot && baseOf(eq[it.slot] || "") === baseOf(entry);
            const stat =
              it && !unid
                ? [
                    gearStat(it.atk, entry) ? "攻+" + gearStat(it.atk, entry) : "",
                    gearStat(it.armor, entry) ? "甲+" + gearStat(it.armor, entry) : "",
                    gearStat(it.hp_max, entry) ? "血上限+" + gearStat(it.hp_max, entry) : "",
                  ]
                    .filter(Boolean)
                    .join("/")
                : "";
            let btn = "";
            if (it && it.slot && !equipped) {
              btn =
                ' <button data-eq="' +
                esc(entry) +
                '"' +
                (over ? " disabled" : "") +
                ">装备</button>";
            } else if (equipped) {
              btn = ' <span class="cur">已装备</span>';
            }
            // 丢弃：drop:<entry> 动作指令，占一回合；合法性归规则（前端不猜）
            btn +=
              ' <button data-drop="' +
              esc(entry) +
              '" title="丢弃（耗一回合）"' +
              (over ? " disabled" : "") +
              ">丢</button>";
            const label = unid ? "？？？" : it.name;
            // 来历传说：narrator 席（LLM）为已鉴定装备写的短文，随 SSE item_lore 到达
            const lore = (s.item_lore || {})[baseOf(entry)] || "";
            return (
              '<span class="it" title="' +
              esc(unid ? "属性不明——穿上它或用鉴定古卷揭晓" : it.desc || "") +
              '">' +
              esc(label) +
              (stat ? ' <span class="hp">' + stat + "</span>" : "") +
              (count > 1 ? ' <b>×' + count + "</b>" : "") +
              (lore ? ' <i class="lore">✦ ' + esc(lore) + "</i>" : "") +
              btn +
              "</span>"
            );
          })
          .join("");
        const cap = s.bag_cap || 6;
        const kinds = groups.length;
        el.innerHTML =
          '<div class="slotline">' +
          slots +
          " · 金币 " +
          (s.gold || 0) +
          " · 背包 " +
          kinds +
          "/" +
          cap +
          "</div><div>" +
          (inv || '<span class="hp">背包空空如也</span>') +
          "</div>";
        el.querySelectorAll("button[data-eq]").forEach((b) => {
          b.onclick = () => orderEquip(b.getAttribute("data-eq"));
        });
        el.querySelectorAll("button[data-drop]").forEach((b) => {
          b.onclick = () => order("drop:" + b.getAttribute("data-drop"));
        });
      }

      function drawLog(s) {
        const el = $("log");
        el.innerHTML = "";
        // 最新轮数在最上方（倒序展示）
        (s.log || [])
          .slice()
          .reverse()
          .forEach((e) => {
          const d = document.createElement("div");
          d.className = e.kind; // whisper/dm/curse 有专属配色
          if (e.tick === s.tick) d.className += " new";
          d.innerHTML =
            (e.flavor
              ? '<span class="flavor">「' + esc(e.flavor) + "」</span><br>"
              : "") +
            '<span class="t">第' +
            e.tick +
            "轮</span> " +
            esc(e.text);
          el.appendChild(d);
        });
        el.scrollTop = el.scrollHeight;
      }
      function esc(t) {
        return String(t == null ? "" : t).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      function render(s) {
        cur = s;
        $("head").textContent =
          "第 " +
          s.depth +
          " 层 · 等级 " +
          s.level +
          " · 体力 " +
          (s.hero ? s.hero.hp : "?") +
          "/" +
          (s.hero ? s.hero.hp_max : "?");
        $("clock").textContent =
          "第 " +
          s.tick +
          " 轮 · 药水 " +
          s.potions +
          " · 击杀 " +
          s.kills +
          (s.boss_kills ? " · 守主×" + s.boss_kills : "") +
          " · 经验 " +
          s.xp +
          "/" +
          s.xp_next;
        drawFoe(s);
        drawEvent(s);
        drawActs(s);
        drawBag(s);
        drawLog(s);
      }

      // ---- 守主遗产（跨局结转，与 Vue 版共用 localStorage key） ----
      const LEGACY_CAP = 3; // 保留槽位上限：每杀一个守主 +1 槽，多次结转也不超过 3
      function legacyRead() {
        try {
          return JSON.parse(localStorage.getItem("dungeon.legacy.v1") || "{}");
        } catch {
          return {};
        }
      }
      function legacyFor(name) {
        return (legacyRead()[name] || []).slice(0, LEGACY_CAP);
      }
      function saveLegacy(name, items) {
        const all = legacyRead();
        const list = (items || []).slice(0, LEGACY_CAP);
        if (list.length) all[name] = list;
        else delete all[name];
        localStorage.setItem("dungeon.legacy.v1", JSON.stringify(all));
      }

      function finish(result, ticks) {
        over = true;
        es && es.close();
        const w = (result && result.winner) || "";
        const depth = cur ? cur.depth : 0;
        const bosses = cur ? cur.boss_kills || 0 : 0;
        const epitaph = result && result.epitaph ? "「" + result.epitaph + "」" : "";
        const text =
          w === "monsters"
            ? "你永远留在了第 " + depth + " 层（" + ticks + " 轮 · 击倒守主 " + bosses + "）" + epitaph
            : "行到此层，行动上限已到（第 " + depth + " 层 · " + ticks + " 轮）";
        $("status").className = "warn";
        $("status").textContent = text;
        if (cur) {
          cur.status = w === "monsters" ? "dead" : cur.status;
          // 死亡结转：按本局守主数保留背包物品（上限 3），与 Vue 版同一规则
          if (w === "monsters") {
            const name = ($("pname").value || "无名者").trim() || "无名者";
            const keep = Math.min(bosses, LEGACY_CAP);
            saveLegacy(name, (cur.inventory || []).slice(0, keep));
          }
          render(cur);
        }
        submitScore(ticks);
      }

      // ---- 下潜排行榜（solver 服务，经网关 /svc 反代，无需 token） ----
      const svcBase = () => ($("base").value || "").replace(/\/$/, "") + "/svc/dungeon/solver";
      async function loadBoard() {
        try {
          const r = await fetch(svcBase() + "/top");
          const d = await r.json();
          const rows = (d.entries || [])
            .map(
              (e, i) =>
                '<div><span class="rk">#' +
                (i + 1) +
                "</span>" +
                esc(e.name) +
                " · 第" +
                e.depth +
                "层" +
                (e.boss_kills ? " · 守主×" + e.boss_kills : "") +
                " · " +
                e.ticks +
                "轮</div>",
            )
            .join("");
          $("board").innerHTML =
            "<b>下潜排行榜</b>" + (rows || "<div>还没有人留下足迹</div>");
        } catch (e) {
          $("board").innerHTML = "<b>下潜排行榜</b><div>服务暂不可用</div>";
        }
      }
      async function submitScore(ticks) {
        if (!cur || !cur.depth) return;
        try {
          await fetch(svcBase() + "/score", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: $("pname").value.trim() || "无名者",
              depth: cur.depth,
              boss_kills: cur.boss_kills || 0,
              ticks: ticks,
              seed: cur.seed,
            }),
          });
        } catch (e) {
          /* 榜单服务不可用不影响结算 */
        }
        loadBoard();
      }

      // 渲染只来自 SSE payload：订阅时服务端先推当前快照，之后每个真实 tick 推一次；
      // 行为驱动：人不下指令时世界静止（服务端挂起等待），点按钮才会推进一轮。
      function onMsg(msg) {
        // 服务端 SnapshotMsg 的 json tag 是小写：done/tick/result/state
        if (msg.done) {
          setBusy(false);
          finish(msg.result, msg.tick);
          return;
        }
        if (!msg.state) return;
        const s = msg.state;
        render(s);
        // SSE 帧到达：指令已结算入快照，解除 loading（busy 生命周期与 Vue 版一致）
        setBusy(false);
        if (s.status === "won" || s.status === "dead") {
          // 死亡≠立即落终：rules 有终局宽限（1-2 tick），narrator 趁宽限回传
          // 墓志铭、随 done 帧的 result.epitaph 到。这里不提前 finish，等 done 帧。
          return;
        }
        $("status").className = "";
        $("status").textContent =
          s.hero && s.hero.stance
            ? "当前姿势：" + (LABEL[s.hero.stance] || s.hero.stance)
            : "";
      }

      // 指令下发三入口共用 busy 互斥：请求在途时忽略后续点击（UI 按钮短暂变灰）。
      // busy 解除靠 SSE 帧到达（onMsg）；这里另有兜底计时，防网络异常时永久锁死。
      // 恢复时统一按 over 重置禁用态；正常 tick 渲染会随后重建按钮。
      let busyTimer = null;
      function setBusy(v) {
        busy = v;
        if (busyTimer) {
          clearTimeout(busyTimer);
          busyTimer = null;
        }
        if (v) busyTimer = setTimeout(() => setBusy(false), 6000);
        document
          .querySelectorAll("button")
          .forEach((b) => (b.disabled = v ? true : over));
      }
      async function order(action) {
        if (over || busy || !cur) return;
        setBusy(true);
        try {
          await api("POST", "/v1/games/" + matchId + "/commands", {
            player: "p0",
            commands: { action },
          });
        } catch (e) {
          if (String(e.message).includes("match over")) finish({}, cur.tick);
          else $("status").textContent = "指令失败：" + e.message;
        }
      }
      async function orderChoose(optId) {
        if (over || busy || !cur) return;
        setBusy(true);
        try {
          await api("POST", "/v1/games/" + matchId + "/commands", {
            player: "p0",
            commands: { choose: optId },
          });
        } catch (e) {
          if (String(e.message).includes("match over")) finish({}, cur.tick);
          else $("status").textContent = "选择失败：" + e.message;
        }
      }
      async function orderEquip(itemId) {
        if (over || busy || !cur) return;
        setBusy(true);
        try {
          await api("POST", "/v1/games/" + matchId + "/commands", {
            player: "p0",
            commands: { equip: itemId },
          });
        } catch (e) {
          if (String(e.message).includes("match over")) finish({}, cur.tick);
          else $("status").textContent = "换装失败：" + e.message;
        }
      }

      $("new").onclick = async () => {
        try {
          es && es.close();
          $("log").innerHTML = "";
          $("acts").innerHTML = "";
          $("bag").innerHTML = "";
          // p0 = 你（人），p1 = 旁白席（LLM 文案/传说/墓志铭），p2 = 军师低语席
          // （Jev 建议），p3 = 地牢之主席（Jev 对抗，规则侧有冷却兜底）。
          const m = await api("POST", "/v1/games", {
            game: "dungeon",
            seed: Number($("seed").value) || 0,
            tick_ms: 2000,
            players: [
              { human: true },
              { brain: { brain: "narrator" } },
              { brain: { brain: "oracle" } },
              { brain: { brain: "dm" } },
            ],
            // 守主遗产：上局死亡结转的物品（规则端会再校验，上限 3）
            props: {
              legacy: legacyFor(($("pname").value || "无名者").trim() || "无名者"),
            },
          });
          matchId = m.match_id;
          over = false;
          // SSE 每 tick 广播的是 tick() 返回的原始 state（不带 catalog）；
          // 道具表只在 rules.snapshot() 里，这里开局经 REST 拉一次并缓存，
          // 之后所有渲染都用这份静态表（规则表是唯一事实源）。
          try {
            const full = await api("GET", "/v1/games/" + matchId);
            CATALOG = (full.snapshot && full.snapshot.catalog) || {};
          } catch (e2) {
            CATALOG = {};
          }
          $("status").className = "";
          $("status").textContent = "已进入地牢 " + matchId;
          const q = $("token").value
            ? "?token=" + encodeURIComponent($("token").value)
            : "";
          es = new EventSource(base() + "/v1/games/" + matchId + "/events" + q);
          es.addEventListener("tick", (e) => onMsg(JSON.parse(e.data)));
          es.addEventListener("over", (e) => onMsg(JSON.parse(e.data)));
          es.onerror = () => {
            /* over 后连接由服务端关闭，属正常 */
          };
        } catch (e) {
          $("status").className = "warn";
          $("status").textContent = "开局失败：" + e.message;
        }
      };

      $("stop").onclick = async () => {
        if (!matchId) return;
        try {
          await api("POST", "/v1/games/" + matchId + "/stop", {});
          log_stop();
        } catch (e) {
          /* 对局已卸载 */
        }
      };
      function log_stop() {
        $("status").className = "warn";
        $("status").textContent = "本次探险已放弃。";
      }
      loadBoard(); // 页面打开即展示下潜排行榜
    </script>
  </body>
</html>
